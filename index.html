<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="StudyWeek — Dashboard e agenda semanal integrados para planejamento de estudos." />
  <meta name="theme-color" content="#0d0d0f" />
  <title>StudyWeek — Dashboard + Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='80' fill='%23c9f542'>◈</text></svg>" />
</head>
<body>

  <!-- HEADER (TOPO FIXO) -->
  <header class="header">
    <div class="header-left">
      <span class="logo-icon">◈</span>
      <h1 class="logo-title">StudyWeek</h1>
    </div>
    <div class="header-center">
      <div class="week-nav">
        <button class="btn-week-nav" id="btnPrevWeek" aria-label="Semana anterior">←</button>
        <div class="week-info">
          <span class="week-label">Semana</span>
          <span class="week-range" id="weekRange">—</span>
        </div>
        <button class="btn-week-nav" id="btnNextWeek" aria-label="Próxima semana">→</button>
      </div>
    </div>
    <div class="header-right">
      <button class="btn-icon" id="btnThemeToggle" aria-label="Alternar tema" title="Alternar tema">☀️</button>
      <button class="btn-primary" id="btnNewSession">+ Nova Sessão</button>
      <div class="export-menu-wrapper">
        <button class="btn-export" id="btnExport" aria-label="Exportar ou imprimir" aria-haspopup="menu">Exportar</button>
        <div class="export-menu" id="exportMenu" role="menu">
          <button class="export-option" data-export="pdf" role="menuitem">📄 Exportar PDF</button>
          <button class="export-option" data-export="png" role="menuitem">🖼️ Salvar como PNG</button>
          <button class="export-option" data-export="text" role="menuitem">📝 Exportar plano semanal (.txt)</button>
          <button class="export-option" data-export="ical" role="menuitem">📅 Adicionar ao Google Calendar</button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN LAYOUT: 2 COLUNAS (desktop) / STACK (mobile) -->
  <main class="main-layout">
    
    <!-- COLUNA ESQUERDA: DASHBOARD -->
    <aside class="dashboard" id="dashboard">
      <h2 class="section-title">Dashboard</h2>
      
      <!-- CARD: Progresso -->
      <div class="dashboard-card progress-card">
        <h3 class="card-title">Progresso</h3>
        <div class="progress-visual">
          <div class="progress-ring-wrap" role="status" aria-label="Progresso semanal">
            <svg class="progress-ring" width="120" height="120" aria-hidden="true">
              <circle class="ring-bg" cx="60" cy="60" r="52"/>
              <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52"/>
            </svg>
            <span class="progress-pct" id="progressPct" aria-live="polite">0%</span>
          </div>
        </div>
        <div class="progress-text">
          <div class="progress-label"><span id="statDone">0</span> concluídas de <span id="statTotal">0</span> planejadas</div>
        </div>
      </div>

      <!-- CARD: Sessões e Horas -->
      <div class="dashboard-card stats-card">
        <div class="stat-item">
          <span class="stat-label">Total de Horas</span>
          <span class="stat-value" id="statHours">0h</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Matérias</span>
          <span class="stat-value" id="statSubjects">0</span>
        </div>
      </div>

      <!-- CARD: Matérias -->
      <div class="dashboard-card">
        <h3 class="card-title">Matérias</h3>
        <ul class="subjects-list" id="subjectsList">
          <!-- [MELHORIA 1] Gerado dinamicamente com empty state -->
        </ul>
      </div>

      <!-- CARD: Resumo por Dia -->
      <div class="dashboard-card">
        <h3 class="card-title">Resumo da Semana</h3>
        <div class="day-summary" id="daySummary">
          <!-- Gerado via JS -->
        </div>
      </div>

      <!-- CARD: Próxima Sessão -->
      <div class="dashboard-card">
        <h3 class="card-title">Próxima Sessão</h3>
        <div class="next-session" id="nextSession">
          <div class="empty-list">Nenhuma sessão planejada</div>
        </div>
      </div>
    </aside>

    <!-- COLUNA DIREITA: AGENDA SEMANAL EM GRADE -->
    <section class="agenda-section">
      <div class="time-grid-wrapper">
        <!-- Header com dias da semana -->
        <div class="time-grid-header">
          <div class="time-labels-col"></div>
          <div class="days-header" id="daysHeader">
            <!-- Gerado via JS -->
          </div>
        </div>
        
        <!-- Grid com horários e sessões -->
        <div class="time-grid-container">
          <div class="time-labels" id="timeLabels">
            <!-- Gerado via JS -->
          </div>
          <div class="time-grid" id="timeGrid">
            <!-- Gerado via JS -->
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- DRAWER: NOVA SESSÃO / EDITAR [MELHORIA 4] Slide-in panel lateral -->
  <div class="drawer-overlay" id="modalOverlay" role="dialog" aria-labelledby="modalTitle">
    <div class="drawer-panel">
      <div class="drawer-header">
        <h3 class="drawer-title" id="modalTitle">Nova Sessão</h3>
        <button class="btn-close-drawer" id="btnCloseDraw" aria-label="Fechar formulário">✕</button>
      </div>
      <form id="sessionForm" class="drawer-content">
        
        <fieldset class="form-group">
          <legend>Dia da semana</legend>
          <div class="day-picker" id="dayPicker" role="group">
            <button type="button" class="day-btn" data-day="0" aria-label="Segunda-feira">SEG</button>
            <button type="button" class="day-btn" data-day="1" aria-label="Terça-feira">TER</button>
            <button type="button" class="day-btn" data-day="2" aria-label="Quarta-feira">QUA</button>
            <button type="button" class="day-btn" data-day="3" aria-label="Quinta-feira">QUI</button>
            <button type="button" class="day-btn" data-day="4" aria-label="Sexta-feira">SEX</button>
            <button type="button" class="day-btn" data-day="5" aria-label="Sábado">SÁB</button>
            <button type="button" class="day-btn" data-day="6" aria-label="Domingo">DOM</button>
          </div>
        </fieldset>

        <div class="form-group">
          <label for="inputSubject">Matéria / Tema</label>
          <input type="text" id="inputSubject" placeholder="ex: Cálculo, Inglês…" maxlength="40" required />
        </div>

        <div class="form-row">
          <div class="form-group half">
            <label for="inputStart">Início</label>
            <input type="time" id="inputStart" value="08:00" required />
          </div>
          <div class="form-group half">
            <label for="inputEnd">Fim</label>
            <input type="time" id="inputEnd" value="09:00" required />
          </div>
        </div>

        <fieldset class="form-group">
          <legend>Cor da matéria</legend>
          <!-- [MELHORIA 3] Grid de 12 cores customizado (substituindo input color nativo) -->
          <div class="color-picker" id="colorPicker" role="group">
            <button type="button" class="color-btn selected" data-color="#EF4444" style="background:#EF4444" aria-label="Vermelho"></button>
            <button type="button" class="color-btn" data-color="#F97316" style="background:#F97316" aria-label="Laranja"></button>
            <button type="button" class="color-btn" data-color="#EAB308" style="background:#EAB308" aria-label="Amarelo"></button>
            <button type="button" class="color-btn" data-color="#22C55E" style="background:#22C55E" aria-label="Verde"></button>
            <button type="button" class="color-btn" data-color="#14B8A6" style="background:#14B8A6" aria-label="Verde-água"></button>
            <button type="button" class="color-btn" data-color="#3B82F6" style="background:#3B82F6" aria-label="Azul"></button>
            <button type="button" class="color-btn" data-color="#8B5CF6" style="background:#8B5CF6" aria-label="Púrpura"></button>
            <button type="button" class="color-btn" data-color="#EC4899" style="background:#EC4899" aria-label="Rosa"></button>
            <button type="button" class="color-btn" data-color="#64748B" style="background:#64748B" aria-label="Cinza-azul"></button>
            <button type="button" class="color-btn" data-color="#0EA5E9" style="background:#0EA5E9" aria-label="Ciano"></button>
            <button type="button" class="color-btn" data-color="#F43F5E" style="background:#F43F5E" aria-label="Magenta"></button>
            <button type="button" class="color-btn" data-color="#A3E635" style="background:#A3E635" aria-label="Lima"></button>
          </div>
        </fieldset>

        <div class="form-group">
          <label for="inputNotes">Notas (opcional)</label>
          <textarea id="inputNotes" placeholder="Cap. 3, exercícios 1–10…" rows="3" maxlength="120"></textarea>
        </div>

        <div class="drawer-actions">
          <button type="button" class="btn-delete" id="btnDelete" style="display:none;">Excluir</button>
          <div class="actions-right">
            <button type="button" class="btn-cancel" id="btnCancel">Cancelar</button>
            <button type="submit" class="btn-save" id="btnSave">Salvar</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- TOAST NOTIFICATIONS -->
  <div class="toast" id="toast" role="alert" aria-live="polite" aria-atomic="true"></div>

  <!-- [MELHORIA 12] Scripts para exportação (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script src="app.js"></script>
</body>
</html>
